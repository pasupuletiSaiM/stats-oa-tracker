<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>

<title>Stats &amp; Probability OA Tracker</title>

<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
/* Layout: an OMR answer sheet — a sticky score strip on top, then one ruled row per question with a bubble to fill in. */
:root{
  --paper:#f4f6f9; --sheet:#ffffff; --ink:#18202e; --muted:#5b6578; --rule:#dfe3ec;
  --pen:#2b48c9; --pen-soft:#e4e9fb; --revisit:#b06a00; --revisit-soft:#fbefd9;
  --easy:#1f7a4d; --med:#9a6a00; --hard:#b3372e;
  --f-display:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;
  --f-body:"Atkinson Hyperlegible",ui-sans-serif,system-ui,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#0f131b; --sheet:#161c27; --ink:#e6e9f0; --muted:#98a2b5; --rule:#262e3d;
  --pen:#8aa2ff; --pen-soft:#1f2a4d; --revisit:#f0b04a; --revisit-soft:#3a2c12;
  --easy:#5cc98f; --med:#e2b44a; --hard:#f07a6e; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#0f131b; --sheet:#161c27; --ink:#e6e9f0; --muted:#98a2b5; --rule:#262e3d;
  --pen:#8aa2ff; --pen-soft:#1f2a4d; --revisit:#f0b04a; --revisit-soft:#3a2c12;
  --easy:#5cc98f; --med:#e2b44a; --hard:#f07a6e; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45}
.wrap{max-width:980px;margin:0 auto;padding-block:28px 64px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;gap:18px}
h1{font-family:var(--f-display);font-weight:800;font-size:clamp(1.6rem,4vw,2.3rem);line-height:1.1;margin:0;text-wrap:balance;letter-spacing:-.01em}
.sub{color:var(--muted);margin:6px 0 0;max-width:62ch}
.strip{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--paper);padding-block:10px;display:grid;gap:12px;border-bottom:1px solid var(--rule)}
.scores{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.score{background:var(--sheet);border:1px solid var(--rule);border-radius:10px;padding:10px 12px;display:grid;gap:6px;min-width:0}
.score .lbl{font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.score .num{font-family:var(--f-mono);font-variant-numeric:tabular-nums;font-size:1.15rem}
.score .num small{color:var(--muted);font-size:.8rem}
.bar{height:6px;border-radius:99px;background:var(--rule);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--pen);transition:width .3s}
.controls{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.seg{display:inline-flex;border:1px solid var(--rule);border-radius:99px;background:var(--sheet);padding:2px}
.seg button{font:inherit;font-size:.85rem;border:0;background:none;color:var(--muted);padding:6px 12px;border-radius:99px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--pen);color:var(--sheet)}
input[type=search],select{font:inherit;font-size:.9rem;color:var(--ink);background:var(--sheet);border:1px solid var(--rule);border-radius:8px;padding:7px 10px;min-width:0}
input[type=search]{flex:1 1 200px}
button:focus-visible,input:focus-visible,select:focus-visible,a:focus-visible{outline:2px solid var(--pen);outline-offset:2px}
.count{color:var(--muted);font-size:.85rem}
.sheet{background:var(--sheet);border:1px solid var(--rule);border-radius:12px;overflow:hidden}
.sec{font-family:var(--f-display);font-weight:600;font-size:.8rem;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);padding:12px 16px;border-bottom:1px solid var(--rule);background:var(--paper)}
.row{display:grid;grid-template-columns:auto 2.6rem minmax(0,1fr) auto;gap:12px;align-items:start;padding:12px 16px;border-bottom:1px solid var(--rule)}
.row:last-child{border-bottom:0}
.row.done .q a{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--muted)}
.bubble{width:26px;height:26px;border-radius:50%;border:2px solid var(--pen);background:transparent;cursor:pointer;display:grid;place-items:center;padding:0;margin-top:1px;transition:background .15s}
.bubble svg{width:14px;height:14px;opacity:0}
.row.done .bubble{background:var(--pen)}
.row.done .bubble svg{opacity:1}
.bubble svg path{stroke:var(--sheet)}
.n{font-family:var(--f-mono);font-variant-numeric:tabular-nums;color:var(--muted);font-size:.85rem;padding-top:4px;text-align:right}
.q{min-width:0;display:grid;gap:5px}
.q a{color:var(--ink);text-decoration:none;font-weight:700;overflow-wrap:anywhere}
.q a:hover{color:var(--pen);text-decoration:underline}
.meta{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;font-size:.8rem;color:var(--muted)}
.chip{font-family:var(--f-mono);font-size:.72rem;padding:1px 7px;border-radius:99px;border:1px solid currentColor}
.easy{color:var(--easy)}.med{color:var(--med)}.hard{color:var(--hard)}
.prem{font-size:.72rem;padding:1px 7px;border-radius:4px;background:var(--pen-soft);color:var(--pen)}
.tags{display:flex;flex-wrap:wrap;gap:4px}
.tag{font-size:.72rem;color:var(--muted);background:var(--paper);border:1px solid var(--rule);border-radius:4px;padding:0 6px}
.flag{border:1px solid var(--rule);background:var(--sheet);color:var(--muted);border-radius:8px;padding:4px 8px;font:inherit;font-size:.78rem;cursor:pointer;white-space:nowrap}
.row.rev .flag{background:var(--revisit-soft);border-color:var(--revisit);color:var(--revisit)}
.row.rev .n{color:var(--revisit)}
.empty{padding:28px 16px;text-align:center;color:var(--muted)}
.save{font-size:.8rem;color:var(--muted);min-height:1.2em}
@media (max-width:560px){
  .scores{grid-template-columns:1fr 1fr}.scores .score:first-child{grid-column:1/-1}
  .row{grid-template-columns:auto minmax(0,1fr);gap:10px}
  .n{display:none}
  .flag{grid-column:2;justify-self:start}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="wrap">
  <header>
    <h1>Stats &amp; Probability OA Tracker</h1>
    <p class="sub">244 MCQs from OA Helper's statistics and probability tags. Fill the bubble when you finish a question, and flag the ones you want to revisit.</p>

  <div class="strip">
    <div class="scores">

      <div class="score"><span class="lbl">Statistics</span><span class="num" id="s-Statistics">0 <small>/ 0</small></span><div class="bar"><i id="b-Statistics"></i></div></div>

    <div class="controls">
      <div class="seg" role="group" aria-label="Section">
        <button id="sec-all" data-sec="all" aria-pressed="true">Both</button>
        <button id="sec-stat" data-sec="Statistics" aria-pressed="false">Statistics</button>
        <button id="sec-prob" data-sec="Probability" aria-pressed="false">Probability</button>
      </div>
      <div class="seg" role="group" aria-label="Status">
        <button id="st-all" data-st="all" aria-pressed="true">All</button>
        <button id="st-todo" data-st="todo" aria-pressed="false">To do</button>
        <button id="st-done" data-st="done" aria-pressed="false">Done</button>
        <button id="st-rev" data-st="rev" aria-pressed="false">Revisit</button>
      </div>
      <input id="q" type="search" placeholder="Search title, company or tag" aria-label="Search">
      <select id="sort" aria-label="Sort">
        <option value="new">Newest first</option>
        <option value="easy">Easiest first</option>
        <option value="hard">Hardest first</option>
        <option value="company">By company</option>
      </select>
      <span class="count" id="count"></span>
    </div>
    <div class="save" id="save" aria-live="polite"></div>
  </div>

  <div id="list"></div>
</div>

 "t": "Probability for a Card Selection", "c": "Mathworks", "d": 32, "p": true, "dt": "2026-08-12", "s": "Probability", "tags": ["Probability"], "u": "https://www.oahelper.in/problems/OTEwMDAwNTQ5fDA/probability-for-a-card-selection"}, {"id": "OTEwMDAwMDg2fDA", "t": "Conditional Probability Notation", "c": "Iragecapital", "d": null, "p": true, "dt": "2026-08-04", "s": "Probability", "tags": ["Probability"], "u": "https://www.oahelper.in/problems/OTEwMDAwMDg2fDA/conditional-probability-notation"}, {"id": "NTU5OXww", "t": "Probability: One Girl and Two Boys", "c": "Motherson", "d": null, "p": true, "dt": "2026-08-03", "s": "Probability", "tags": ["Probability"], "u": "https://www.oahelper.in/problems/NTU5OXww/probability-one-girl-and-two-boys"}, {"id": "NTM4Nnww", "t": "Conditional Probability of HH Before TTT", "c": "Idfc", "d": 50, "p": true, "dt": "2026-07-28", "s": "Probability", "tags": ["Probability"], "u": "https://www.oahelper.in/problems/NTM4Nnww/conditional-probability-of-hh-before-ttt"}, {"id": "NTMwOXww", "t": "Grid Path Probability Through One Point but Not Another", "c": "Texas Instruments", "d": 30, "p": true, "dt": "2026-07-25", "s": "Probability", "tags": ["Probability"], "u": "https://www.oahelper.in/problems/NTMwOXww/grid-path-probability-through-one-point-but-not-another"}];
const state = { done:{}, rev:{} };
const ui = { sec:'all', st:'all', q:'', sort:'new' };
let store = null, ref = null, writing = false, pending = false;
const LS = 'oah-stats-tracker-v1';
try { const s = JSON.parse(localStorage.getItem(LS) || 'null'); if (s) { state.done = s.done || {}; state.rev = s.rev || {}; } } catch(e) {}
try { const u = JSON.parse(localStorage.getItem(LS + '-ui') || 'null'); if (u) Object.assign(ui, u); } catch(e) {}

const order = {};
['Statistics','Probability'].forEach(s => QS.filter(q => q.s === s).sort((a,b) => b.dt.localeCompare(a.dt)).forEach((q,i) => order[q.id] = i + 1));

function diff(d){ if (d == null) return ['—','']; if (d < 30) return ['Easy '+d,'easy']; if (d <= 50) return ['Medium '+d,'med']; return ['Hard '+d,'hard']; }
function fmt(dt){ return new Date(dt + 'T00:00:00').toLocaleDateString('en-GB',{day:'numeric',month:'short'}); }

function matches(q){
  if (ui.sec !== 'all' && q.s !== ui.sec) return false;
  if (ui.st === 'todo' && state.done[q.id]) return false;
  if (ui.st === 'done' && !state.done[q.id]) return false;
  if (ui.st === 'rev' && !state.rev[q.id]) return false;
  if (ui.q) { const h = (q.t + ' ' + q.c + ' ' + q.tags.join(' ')).toLowerCase(); if (!ui.q.toLowerCase().split(/\s+/).every(w => h.includes(w))) return false; }
  return true;
}
function sorter(a,b){
  if (ui.sort === 'easy') return (a.d ?? 999) - (b.d ?? 999);
  if (ui.sort === 'hard') return (b.d ?? -1) - (a.d ?? -1);
  if (ui.sort === 'company') return (a.c || '~').localeCompare(b.c || '~') || b.dt.localeCompare(a.dt);
  return b.dt.localeCompare(a.dt);
}
const check = '<svg viewBox="0 0 14 14" aria-hidden="true"><path d="M3 7.5l2.6 2.5L11 4.5" fill="none" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>';
function rowHTML(q){
  const [dl,dc] = diff(q.d), done = !!state.done[q.id], rev = !!state.rev[q.id];
  const el = document.createElement('div');
  el.className = 'row' + (done ? ' done' : '') + (rev ? ' rev' : '');
  el.dataset.id = q.id;
  el.innerHTML = `<button class="bubble" aria-pressed="${done}" aria-label="Mark as done">${check}</button>
    <span class="n">${q.s === 'Statistics' ? 'S' : 'P'}${order[q.id]}</span>
    <div class="q"><a target="_blank" rel="noopener"></a>
      <div class="meta"><span class="co"></span>${dc ? `<span class="chip ${dc}">${dl}</span>` : ''}${q.p ? '<span class="prem">Premium</span>' : ''}<span>Added ${fmt(q.dt)}</span></div>
      <div class="tags"></div></div>
    <button class="flag" aria-pressed="${rev}">${rev ? '★ Revisit' : '☆ Revisit'}</button>`;
  const a = el.querySelector('a'); a.href = q.u; a.textContent = q.t;
  el.querySelector('.co').textContent = q.c || 'Company not listed';
  const tg = el.querySelector('.tags'); q.tags.forEach(t => { const s = document.createElement('span'); s.className = 'tag'; s.textContent = t; tg.appendChild(s); });
  return el;
}
function render(){
  const list = document.getElementById('list'); list.innerHTML = '';
  const shown = QS.filter(matches).sort(sorter);
  document.getElementById('count').textContent = shown.length + ' shown';
  if (!shown.length) { list.innerHTML = '<div class="sheet"><div class="empty">No questions match. Try another filter or clear the search.</div></div>'; }
  else {
    const secs = ui.sort === 'new' && ui.sec === 'all' ? ['Statistics','Probability'] : [null];
    secs.forEach(s => {
      const items = s ? shown.filter(q => q.s === s) : shown; if (!items.length) return;
      const sheet = document.createElement('div'); sheet.className = 'sheet';
      if (s) { const h = document.createElement('div'); h.className = 'sec'; h.textContent = s + ' · ' + items.length; sheet.appendChild(h); }
      items.forEach(q => sheet.appendChild(rowHTML(q)));
      list.appendChild(sheet);
    });
  }
  scores();
  document.querySelectorAll('[data-sec]').forEach(b => b.setAttribute('aria-pressed', b.dataset.sec === ui.sec));
  document.querySelectorAll('[data-st]').forEach(b => b.setAttribute('aria-pressed', b.dataset.st === ui.st));
}
function scores(){
  const set = (k, arr) => { const d = arr.filter(q => state.done[q.id]).length;
    document.getElementById('s-'+k).innerHTML = d + ' <small>/ ' + arr.length + '</small>';
    document.getElementById('b-'+k).style.width = (arr.length ? d / arr.length * 100 : 0) + '%'; };
  set('all', QS); set('Statistics', QS.filter(q => q.s === 'Statistics')); set('Probability', QS.filter(q => q.s === 'Probability'));
}
function saveLocal(){ try { localStorage.setItem(LS, JSON.stringify(state)); } catch(e) {} }
function saveUI(){ try { localStorage.setItem(LS + '-ui', JSON.stringify(ui)); } catch(e) {} }
const msg = t => document.getElementById('save').textContent = t;
async function persist(){
  saveLocal();
  if (!ref) { msg('Saved in this browser'); return; }
  if (writing) { pending = true; return; }
  writing = true; msg('Saving…');
  try { await ref.set({ done: state.done, rev: state.rev, updated: new Date().toISOString() }); msg('Saved'); }
  catch(e) { msg(e && e.code === 'invalid_argument' ? 'View only: progress is kept in this browser' : 'Could not sync. Progress is kept in this browser.'); }
  writing = false;
  if (pending) { pending = false; persist(); }
}
let timer = null;
function queue(){ scores(); clearTimeout(timer); timer = setTimeout(() => { timer = null; persist(); }, 600); }

document.getElementById('list').addEventListener('click', e => {
  const row = e.target.closest('.row'); if (!row) return; const id = row.dataset.id;
  if (e.target.closest('.bubble')) {
    if (state.done[id]) delete state.done[id]; else state.done[id] = new Date().toISOString().slice(0,10);
    const on = !!state.done[id]; row.classList.toggle('done', on); row.querySelector('.bubble').setAttribute('aria-pressed', on); queue();
    if (ui.st !== 'all') setTimeout(render, 350);
  } else if (e.target.closest('.flag')) {
    if (state.rev[id]) delete state.rev[id]; else state.rev[id] = true;
    const on = !!state.rev[id]; row.classList.toggle('rev', on); const f = row.querySelector('.flag'); f.setAttribute('aria-pressed', on); f.textContent = on ? '★ Revisit' : '☆ Revisit'; queue();
    if (ui.st === 'rev') setTimeout(render, 350);
  }
});
document.querySelectorAll('[data-sec]').forEach(b => b.onclick = () => { ui.sec = b.dataset.sec; saveUI(); render(); });
document.querySelectorAll('[data-st]').forEach(b => b.onclick = () => { ui.st = b.dataset.st; saveUI(); render(); });
const qi = document.getElementById('q'); qi.value = ui.q; qi.oninput = () => { ui.q = qi.value.trim(); saveUI(); render(); };
const so = document.getElementById('sort'); so.value = ui.sort; so.onchange = () => { ui.sort = so.value; saveUI(); render(); };
render();

(async () => {
  try {
    store = await window.claude?.use?.('db');
    if (!store) { msg('Saved in this browser'); return; }
    ref = store.doc('progress/main');
    let first = true;
    ref.onSnapshot(snap => {
      if (snap.metadata.hasPendingWrites) return;
      const d = snap.exists ? snap.data() : null;
      if (d) {
        const same = JSON.stringify(d.done || {}) === JSON.stringify(state.done) && JSON.stringify(d.rev || {}) === JSON.stringify(state.rev);
        if (!same && !writing && !timer) { state.done = { ...(d.done || {}) }; state.rev = { ...(d.rev || {}) }; saveLocal(); render(); }
      }
      else if (first && (Object.keys(state.done).length || Object.keys(state.rev).length)) persist();
      first = false;
    }, () => msg('Sync paused. Progress is kept in this browser.'));
  } catch(e) { msg('Saved in this browser'); }
})();
</script>
